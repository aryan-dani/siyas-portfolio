name: IndexNow Quality Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  indexnow:
    name: IndexNow Push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run IndexNow Push
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          NEXT_PUBLIC_SITE_URL: https://www.heartsfromsiya.com
          CI: true
        run: node scripts/indexnow.mjs
