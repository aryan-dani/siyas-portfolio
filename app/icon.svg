<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="30%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#2A0B15" />
      <stop offset="55%" stop-color="#11070A" />
      <stop offset="100%" stop-color="#080708" />
    </radialGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.38" />
      <stop offset="45%" stop-color="#FF8A70" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.06" />
    </linearGradient>
    <radialGradient id="dotGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FF8A70" />
      <stop offset="100%" stop-color="#E11D48" />
    </radialGradient>
  </defs>

  <!-- Luxury Dark Obsidian-Crimson Glass Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGlow)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#rimLight)" stroke-width="1.5" />

  <!-- Editorial Bold 'S' Monogram -->
  <text
    x="25.5"
    y="45.5"
    text-anchor="middle"
    fill="#FAF5F0"
    font-family="system-ui, -apple-system, 'Inter Tight', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="38"
    letter-spacing="-0.05em"
  >S</text>

  <!-- Signature Crimson-Coral Period '.' -->
  <circle cx="45.5" cy="41.5" r="4.6" fill="url(#dotGlow)" />
</svg>
