<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="28%" cy="22%" r="78%">
      <stop offset="0%" stop-color="#310D1B" />
      <stop offset="55%" stop-color="#12070B" />
      <stop offset="100%" stop-color="#070608" />
    </radialGradient>
    <linearGradient id="rimLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.42" />
      <stop offset="48%" stop-color="#F5B88F" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08" />
    </linearGradient>
    <radialGradient id="dotGlow" cx="35%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#F5B88F" />
      <stop offset="55%" stop-color="#FF8A70" />
      <stop offset="100%" stop-color="#E11D48" />
    </radialGradient>
  </defs>

  <!-- Luxury Dark Obsidian-Crimson Glass Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGlow)" />
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#rimLight)" stroke-width="1.5" />

  <!-- Editorial Bold 'S' Monogram -->
  <text
    x="24"
    y="45"
    text-anchor="middle"
    fill="#FAF6F2"
    font-family="system-ui, -apple-system, 'Inter Tight', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="36"
    letter-spacing="-0.04em"
  >S</text>

  <!-- Signature Champagne-Coral Period '.' with balanced typographic kerning -->
  <circle cx="43.5" cy="41.2" r="3.8" fill="url(#dotGlow)" />
</svg>
