<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 910" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2A1714"/>
      <stop offset="55%" stop-color="#5A0F1F"/>
      <stop offset="100%" stop-color="#1E1210"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#F2A93B" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#B3213F" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#1E1210" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded portrait card frame -->
  <rect x="20" y="20" width="660" height="870" rx="44" fill="url(#bg)" stroke="#F6EBDD" stroke-opacity="0.22" stroke-width="2"/>
  <rect x="20" y="20" width="660" height="870" rx="44" fill="url(#glow)"/>

  <!-- Inner dashed placeholder border -->
  <rect x="56" y="56" width="588" height="798" rx="28" stroke="#F6EBDD" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="8 8"/>

  <!-- Minimal image/camera placeholder icon -->
  <g transform="translate(290, 340)" stroke="#F2A93B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <rect x="0" y="0" width="120" height="96" rx="14" fill="#1E1210" fill-opacity="0.55" stroke="#F2A93B" stroke-opacity="0.65"/>
    <circle cx="38" cy="34" r="10" stroke="#F2A93B" stroke-opacity="0.85"/>
    <path d="M14 80 L46 50 L72 72 L90 56 L106 80" stroke="#F6EBDD" stroke-opacity="0.75"/>
  </g>

  <!-- Placeholder text labels -->
  <text x="350" y="485" text-anchor="middle" fill="#F6EBDD" font-family="Georgia, serif" font-style="italic" font-size="30" opacity="0.9">
    portrait placeholder
  </text>
  <text x="350" y="522" text-anchor="middle" fill="#F2A93B" font-family="monospace" font-size="15" letter-spacing="1" opacity="0.8">
    replace with siya's photo
  </text>
</svg>